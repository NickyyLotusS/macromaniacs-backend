name: macromaniacs-backend

services:
  postgres:
    image: postgres:15-alpine
    container_name: macromaniacs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env local}
      POSTGRES_DB: ${POSTGRES_DB:-macromaniacs_db}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - existing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:15-alpine
    container_name: macromaniacs-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: macromaniacs_test
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d macromaniacs_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  existing_pgdata:
    external: true
    name: ${POSTGRES_VOLUME:-macromaniacs-backend_pgdata}
