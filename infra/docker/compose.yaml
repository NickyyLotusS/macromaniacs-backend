services:
  postgres:
    image: postgres:17-alpine
    container_name: macromaniacs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: macromaniacs
    ports:
      - "5432:5432"
    volumes:
      - macromaniacs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d macromaniacs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  macromaniacs_postgres_data: