services:
  postgres:
    image: postgres:17-alpine
    container_name: macromaniacs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: macromaniacs
    ports:
      - "5432:5432"
    volumes:
      - macromaniacs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d macromaniacs"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    container_name: macromaniacs-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: macromaniacs_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d macromaniacs_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  macromaniacs_postgres_data:
